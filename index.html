<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Say what you think a coin will do, in plain English, and get a defined-risk options spread on Derive." />
    <title>Plain English Options</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" />
  </head>
  <body class="x-app">
    <main class="x-root" id="app">
      <div class="x-top">
        <button class="x-bal" id="balBtn" type="button" aria-label="Connect wallet"><span class="x-bal__t"><span id="bal">Connect wallet</span><small id="balNet"></small></span><i>+</i><span class="x-av" aria-hidden="true"></span></button>
      </div>

      <section class="x-builder" id="builder" aria-label="Build a position">
        <div class="x-tags">
          <span class="x-tag x-tag--dark" id="kind">Call spread</span>
          <span class="x-tag"><b>●</b> <span id="spotTag">ETH …</span></span>
          <span class="x-tag is-sim" id="liveTag" role="status"><b>●</b> <span id="liveTxt">Connecting…</span></span>
          <span class="x-seg" role="group" aria-label="Network"><button type="button" data-net="testnet" aria-pressed="true">Testnet</button><button type="button" data-net="mainnet" aria-pressed="false">Mainnet</button></span>
        </div>
        <p class="x-amber" id="netNote" role="note" hidden>Mainnet: orders use real money.</p>
        <h1 class="x-sent">
          I want to make
          <button type="button" class="x-pill x-amt" data-pop="amt" aria-haspopup="dialog"><span id="pAmt">$1,000</span></button>
          if
          <button type="button" class="x-pill x-lav" data-pop="asset" aria-haspopup="dialog"><span id="pAsset">ETH</span></button>
          <button type="button" class="x-pill x-sal" id="pDir" aria-label="Toggle direction"><span id="pDirT">hits</span><svg id="dirIc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></svg></button>
          <button type="button" class="x-pill x-mint" data-pop="tgt" aria-haspopup="dialog"><span id="pTgt">…</span><span class="x-pct" id="pPct"></span></button>
          by
          <button type="button" class="x-pill x-lav" data-pop="date" aria-haspopup="dialog"><span id="pDate">…</span></button>
        </h1>
        <div class="x-quote">
          <span class="x-cost" id="qCost">It costs …</span>
          <span class="x-grey" id="qChance">Waiting for a live price</span>
        </div>
        <p class="x-hint" id="hint" hidden></p>
        <div class="x-pop" id="pop" role="dialog" hidden></div>
      </section>

      <section id="review" hidden></section>
      <section id="done" class="x-done" hidden></section>
      <section id="portfolio" class="x-port" hidden></section>

      <div class="x-scrim" id="sheet" hidden><div class="x-sheet" role="dialog" aria-modal="true" aria-label="Wallet" id="sheetBody"></div></div>

      <p class="x-foot">Live Derive v3 quotes · orders are signed by your own wallet · not financial advice · concept by @rightclcksaveas · <a href="https://github.com/Hasen1506/plain-english-options">source</a></p>
    </main>

    <nav class="x-dock" aria-label="App">
      <button type="button" class="x-ic is-on" data-view="build" aria-label="Build"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg></button>
      <button type="button" class="x-ic" data-view="portfolio" aria-label="Portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20V12h4v8M10 20V6h4v14M14 20v-9h4v9"/></svg></button>
      <span class="x-toast" id="toast" role="status" hidden></span>
      <span class="x-sep" id="dockSep"></span>
      <button type="button" class="x-buy" id="buy" disabled>Buy for <span id="buyAmt">…</span><span class="x-arr">→</span></button>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
